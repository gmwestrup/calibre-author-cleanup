[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "calibre-author-cleanup"
version = "0.1.0"
description = "Cluster, review, and merge duplicate author entries in a large Calibre library"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "George Westrup" }]
keywords = ["calibre", "ebooks", "audiobooks", "metadata", "deduplication", "authors"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = [
    "rapidfuzz>=3.0",
]

[project.urls]
Homepage = "https://github.com/YOUR-USERNAME/calibre-author-cleanup"
Issues = "https://github.com/YOUR-USERNAME/calibre-author-cleanup/issues"

[project.scripts]
calibre-author-cleanup = "calibre_author_cleanup.cli:main"

[tool.setuptools]
packages = ["calibre_author_cleanup"]
